<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Recording</title>
  <style>
    /* The same tokens as the rest of the extension, in the smallest window they will ever be in. */
    :root {
      color-scheme: light dark;
      --surface: #ffffff;
      --surface-2: #edeff2;
      --rule: #e4e7eb;
      --edge: #8d95a1;
      --text: #12151a;
      --muted: #5b6472;
      --danger: #b42318;
      --on-danger: #ffffff;
      --r1: 4px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #16191d;
        --surface-2: #1d2126;
        --rule: #262b31;
        --edge: #646b75;
        --text: #e6e9ec;
        --muted: #9ba3ae;
        --danger: #fda29b;
        --on-danger: #2a0b08;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 10px;
      background: var(--surface); color: var(--text);
      font: 13px/1.4 -apple-system, "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none; cursor: default;
    }
    .top { display: flex; align-items: center; gap: 10px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--danger); flex: 0 0 auto; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    #clock {
      font-family: ui-monospace, "Cascadia Mono", SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 26px; font-weight: 500; letter-spacing: -.5px; font-variant-numeric: tabular-nums;
    }
    #size { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .row { display: flex; align-items: center; gap: 8px; }
    button {
      height: 30px; padding: 0 12px; border-radius: var(--r1);
      border: 1px solid var(--edge); background: var(--surface); color: var(--text);
      font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
    }
    button:hover { background: var(--surface-2); }
    #stop { background: var(--danger); border-color: var(--danger); color: var(--on-danger); flex: 1; }
    button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .note { margin: 0; font-size: 11.5px; line-height: 1.35; color: var(--muted); }
    .note b { color: var(--text); font-weight: 600; }
    #gone { color: var(--danger); }
  </style>
</head>
<body>
  <div class="top">
    <span class="dot" aria-hidden="true"></span>
    <span id="clock" role="timer">00:00</span>
    <span id="size">0.0 MB</span>
  </div>
  <div class="row">
    <button id="stop">Stop recording</button>
    <button id="hide" title="Close this window; the recording carries on">Hide</button>
  </div>
  <p class="note" id="inShot" hidden><b>This window is on the screen you are recording</b>, so it will
    be in the video. Drag it to another screen — it will open there next time — or press Hide.</p>
  <p class="note" id="gone" hidden>The recorder tab is not answering. Open it to see what happened.</p>
  <script src="rec-float.js"></script>
</body>
</html>
