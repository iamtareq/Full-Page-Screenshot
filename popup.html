<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Full Page Capture</title>
  <style>
    /* ============================ Design tokens ============================
       ONE set, shared with result.css and options.html. Two ink tiers, two
       border weights, two radii, one accent. Every value here was picked
       against a measured contrast ratio - the numbers are in the comments so
       the next person does not have to re-derive them.

       The tier that used to be called --faint (#98a2b3) is GONE. It carried
       every description in this popup at 2.58:1, which is below the 4.5:1 AA
       floor for body text; --muted replaces it at 5.98:1. There is deliberately
       no third, fainter tier for text to drift back into. */
    :root {
      color-scheme: light dark;

      --surface:   #ffffff;   /* the popup itself */
      --surface-2: #edeff2;   /* the one hover fill, for every control family */
      --surface-3: #e3e6ea;   /* the one press fill */

      /* Two border weights with two different jobs. --rule divides things that
         are already inside a box; --edge bounds anything you can press, and is
         the only one that has to clear WCAG 1.4.11. The old single hairline
         (#e4e7ec) was 1.24:1 and was doing both jobs badly. */
      --rule: #e4e7eb;        /* 1.15:1 on white - decorative, divides only */
      --edge: #8d95a1;        /* 3.02:1 on white - bounds anything interactive */

      --text:  #12151a;       /* 18.29:1 */
      --muted: #5b6472;       /* 5.98:1 on white, 5.19:1 on --surface-2, 5.29:1 on the wash */

      --accent:      #0f766e; /* 5.47:1 as ink on white, and under white as a fill */
      --accent-wash: #e9f3f1; /* the one "selected / current / notice" ground */
      --accent-line: #a7cdc8; /* its border */

      /* The ink that sits ON an accent fill. Light and dark disagree, and that
         disagreement is the whole reason white-on-teal shipped at 3.74:1 here
         for so long - so it is a token now, not a rule to remember. */
      --on-accent: #ffffff;   /* 5.47:1 on #0f766e */

      --r1: 4px;              /* controls, chips, segments */
      --r2: 6px;              /* rows, cards, the banner */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface:   #16191d;
        --surface-2: #1d2126;
        --surface-3: #242a31;
        --rule: #262b31;
        --edge: #646b75;      /* 3.28:1 on --surface */
        --text:  #e6e9ec;     /* 14.47:1 */
        --muted: #9ba3ae;     /* 6.92:1 on --surface, 6.43:1 on the wash */
        --accent:      #2dd4bf;
        --accent-wash: #10231f;
        --accent-line: #17544c;
        --on-accent:   #04211f; /* 9.08:1 on #2dd4bf - white here would be 1.86:1 */
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      width: 304px; margin: 0; background: var(--surface); color: var(--text);
      font: 13px/1.45 -apple-system, "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Every number in the product is set in the mono stack with tabular figures,
       so a value can never change width as it updates. */
    .ver, .kbd, .more-n {
      font: 500 10.5px/16px ui-monospace, "Cascadia Mono", SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    /* ONE focus rule for the whole surface, expressed as `outline` rather than
       `box-shadow`. That is deliberate: a later rule setting box-shadow (a hover
       lift, an active fill) silently cancels a box-shadow ring, which is exactly
       how the segmented control, the update button and the footer links ended up
       with no focus indicator at all. An outline cannot be cancelled that way. */
    :where(button, a, [tabindex]):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* header: a quiet identity strip, not a coloured band */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 14px 12px; border-bottom: 1px solid var(--rule);
    }
    header img { width: 26px; height: 26px; border-radius: var(--r2); flex: 0 0 auto; }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.2px; }
    header .tag { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 1px; }
    header .ver {
      margin-left: auto; flex: 0 0 auto; color: var(--muted);
      background: var(--surface-2); border: 1px solid var(--rule);
      padding: 3px 6px; border-radius: var(--r1);
    }

    .body { padding: 10px; display: flex; flex-direction: column; gap: 6px; }

    /* capture rows.
       These used to be white on white, bounded by a 1.24:1 hairline - so the one
       thing telling you they were pressable was invisible. They are bounded by
       --edge now (3.02:1), which is what WCAG 1.4.11 asks of a component
       boundary that carries no other affordance. */
    .btn {
      display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 10px; text-align: left;
      border: 1px solid var(--edge); border-radius: var(--r2); background: var(--surface);
      color: var(--text); cursor: pointer;
      transition: background .12s ease, border-color .12s ease;
    }
    .btn:hover { background: var(--surface-2); }
    /* Press is its own fill, not the accent wash. Sharing --accent-soft between
       "pressed" and "there is an update" is what made the banner read as a
       stuck button; the wash means exactly one thing now. */
    .btn:active { background: var(--surface-3); }

    .chip {
      flex: 0 0 auto; width: 32px; height: 32px; border-radius: var(--r1); display: grid; place-items: center;
      background: var(--surface-2); border: 1px solid var(--rule); color: var(--muted);
    }
    /* only the primary action carries the accent */
    .btn.primary { border-color: var(--accent); }
    .btn.primary .chip { background: var(--accent); border-color: transparent; color: var(--on-accent); }
    /* Icons render a 1.0px line at every size: stroke-width = 24 / rendered px.
       The four rules in this file used to land on 0.975, 0.99, 1.19 and 1.275px,
       so no two glyphs in the popup had the same line quality. */
    .chip svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }

    .txt { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
    .txt b { font-size: 13px; font-weight: 500; letter-spacing: -.1px; }
    .btn.primary .txt b { font-weight: 600; }
    .txt span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kbd {
      margin-left: auto; flex: 0 0 auto; color: var(--muted);
      background: var(--surface-2); border: 1px solid var(--rule);
      padding: 3px 5px; border-radius: var(--r1); white-space: nowrap;
    }

    /* delay */
    .timer { display: flex; align-items: center; gap: 8px; padding: 4px 2px 0; }
    .timer .tlabel { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
    .timer .ticon { width: 13px; height: 13px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.846; stroke-linecap: round; stroke-linejoin: round; }
    .seg { display: flex; margin-left: auto; border: 1px solid var(--edge); border-radius: var(--r1); overflow: hidden; }
    .seg button {
      border: 0; border-right: 1px solid var(--rule); background: var(--surface); color: var(--muted); cursor: pointer;
      font-family: inherit; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 6px 9px;
      transition: background .12s, color .12s;
    }
    .seg button:last-child { border-right: 0; }
    .seg button:hover { background: var(--surface-2); color: var(--text); }
    .seg button.active { background: var(--accent); color: var(--on-accent); font-weight: 600; }
    /* inset, so the ring is not clipped by the group's overflow */
    .seg button:focus-visible { outline-offset: -3px; }
    /* the selected segment IS the accent, so its ring has to be the ink */
    .seg button.active:focus-visible { outline-color: var(--on-accent); }

    /* update: informative, not a warning */
    .update {
      display: none; align-items: center; gap: 10px; padding: 9px 10px 9px 11px;
      border: 1px solid var(--accent-line); border-radius: var(--r2); background: var(--accent-wash);
    }
    .update.show { display: flex; }
    .update .udot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .update .ucol { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
    .update b { font-size: 13px; font-weight: 600; color: var(--text); }
    /* Two lines, then clip. The old single-line ellipsis never fired: the rule
       set overflow + text-overflow but not white-space, so the text just wrapped. */
    .update .h {
      font-size: 12px; color: var(--muted);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .update code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    .update .ubtn, .update-warn .ubtn {
      margin-left: auto; flex: 0 0 auto; border: 0; border-radius: var(--r1); padding: 7px 11px; cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1; background: var(--accent); color: var(--on-accent);
      /* the label cycles Update / Updating… / Reloading… / Retry - hold the width */
      min-width: 84px; text-align: center;
      transition: background .12s;
    }
    .update .ubtn:hover, .update-warn .ubtn:hover { background: color-mix(in srgb, var(--accent) 88%, var(--text)); }
    .update .ubtn:disabled, .update-warn .ubtn:disabled { opacity: .55; cursor: default; }
    /* Update now would close every open editor (chrome.runtime.reload), unsaved marks and all.
       This box lists them first. No line clamp: the whole sentence has to show. */
    .update-warn {
      display: flex; flex-direction: column; gap: 8px; padding: 10px 11px;
      border: 1px solid var(--edge); border-radius: var(--r2); background: var(--surface-2);
      font-size: 12px; color: var(--text);
    }
    .update-warn p { margin: 0; line-height: 1.4; }
    .update-warn ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .update-warn li { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .update-warn .uw-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .update-warn .uw-status { flex: 0 0 auto; color: var(--muted); }
    .update-warn .uw-go { flex: 0 0 auto; border: 0; background: transparent; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: 2px 4px; border-radius: var(--r1); }
    .update-warn .uw-go:hover { background: var(--surface-3); }
    .update-warn .uw-actions { display: flex; justify-content: flex-end; gap: 6px; }
    .update-warn .uw-ghost { border: 1px solid var(--edge); background: transparent; color: var(--text); font: inherit; font-weight: 600; border-radius: var(--r1); padding: 6px 10px; cursor: pointer; }

    /* "More ways to capture": a quiet disclosure, deliberately lighter than a capture
       row so it reads as a hint that there is more - not as a fourth equal choice. */
    .more {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 8px 10px; border: 0; border-radius: var(--r1); background: transparent;
      color: var(--muted); font-weight: 500; font-size: 12px; line-height: 1; text-align: left; cursor: pointer;
      font-family: inherit;
      transition: background .12s ease, color .12s ease;
    }
    .more:hover { background: var(--surface-2); color: var(--text); }
    .more-chev {
      width: 13px; height: 13px; flex: 0 0 auto; fill: none; stroke: currentColor;
      stroke-width: 1.846; stroke-linecap: round; stroke-linejoin: round;
      transition: transform .18s ease;
    }
    .more[aria-expanded="true"] .more-chev { transform: rotate(90deg); }
    .more[aria-expanded="true"] { color: var(--text); }
    .more-n {
      margin-left: auto; flex: 0 0 auto;
      color: var(--muted); background: var(--surface-2); border: 1px solid var(--rule);
      padding: 2px 6px; border-radius: var(--r1);
    }
    .more[aria-expanded="true"] .more-n { opacity: 0; }
    /* Animate a measured height. The tidy 0fr->1fr grid trick is one-way here: with
       min-height:0 the 1fr track resolves to 0 in an auto-height container, so once it
       has collapsed it never reopens. JS sets the pixel height and releases it to auto
       when the transition ends. */
    .more-wrap { height: 0; overflow: hidden; transition: height .2s ease; }
    .more-inner { display: flex; flex-direction: column; gap: 6px; }
    /* only once it has settled, so a focus ring is not clipped by the animating box */
    .more-wrap.settled { overflow: visible; }

    /* footer */
    .foot {
      display: flex; align-items: center; justify-content: flex-end; gap: 2px;
      padding: 8px 10px 11px; border-top: 1px solid var(--rule);
    }
    .foot button {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500;
      color: var(--muted); text-decoration: none; cursor: pointer; padding: 6px 9px; border-radius: var(--r1);
      transition: background .12s, color .12s;
    }
    .foot button:hover { background: var(--surface-2); color: var(--text); }
    /* linecap/linejoin were missing here, which is why the Shortcuts keyboard
       glyph's four keycap dots - zero-length paths - never rendered at all. */
    .foot button svg {
      width: 14px; height: 14px; fill: none; stroke: currentColor;
      stroke-width: 1.714; stroke-linecap: round; stroke-linejoin: round;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" />
    <div>
      <h1>Full Page Capture</h1>
      <span class="tag">Capture &middot; annotate &middot; share</span>
    </div>
    <span class="ver" id="verLabel"></span>
  </header>

  <div class="body">
    <div class="update" id="updateBanner">
      <span class="udot"></span>
      <span class="ucol">
        <b>Update available <span id="updVer"></span></b>
        <span class="h" id="updHow">One click &mdash; pulls it and reloads.</span>
      </span>
      <button class="ubtn" id="updBtn">Update</button>
    </div>
    <div class="update-warn" id="updWarn" role="alert" hidden>
      <p id="updWarnText"></p>
      <ul id="updWarnList"></ul>
      <div class="uw-actions">
        <button type="button" class="uw-ghost" id="updCancel">Cancel</button>
        <button type="button" class="ubtn" id="updAnyway">Update anyway</button>
      </div>
    </div>

    <button class="btn primary" id="full">
      <span class="chip"><svg viewBox="0 0 24 24"><path d="M5 22V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v17"/><path d="M9 7h6M9 11h6M9 15h6M9 19h6"/></svg></span>
      <span class="txt"><b>Full page</b><span>Entire scrollable page</span></span>
      <span class="kbd" id="kbd-full" hidden></span>
    </button>
    <button class="btn" id="visible">
      <span class="chip"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8.5h20"/><path d="M5 6.2h.01M7.5 6.2h.01"/></svg></span>
      <span class="txt"><b>Visible area</b><span>Just what you see now</span></span>
      <span class="kbd" id="kbd-visible" hidden></span>
    </button>
    <button class="btn" id="region">
      <span class="chip"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="8" y="8" width="8" height="8" rx="1" stroke-dasharray="3.2 2.4"/></svg></span>
      <span class="txt"><b>Capture area</b><span>Drag to select &middot; scrolls</span></span>
      <span class="kbd" id="kbd-region" hidden></span>
    </button>
    <button class="more" id="moreBtn" type="button" aria-expanded="false" aria-controls="moreWrap">
      <svg class="more-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      <span>More ways to capture</span>
      <span class="more-n">2</span>
    </button>
    <div class="more-wrap" id="moreWrap">
      <div class="more-inner">
        <button class="btn" id="element">
      <span class="chip"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3"/><path d="M3 13v3a2 2 0 0 0 2 2h4"/><path d="M13 12.5l8.5 3.6-3.5 1.2-1.2 3.5z"/></svg></span>
      <span class="txt"><b>Capture element</b><span>Hover &amp; click a component</span></span>
      <span class="kbd" id="kbd-element" hidden></span>
        </button>
        <button class="btn" id="scroller">
      <span class="chip"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="14" height="16" rx="1.5"/><path d="M2 9h14M7 9v11M11.5 9v11"/><path d="M20 7v10m0 0l-2.3-2.3M20 17l2.3-2.3"/></svg></span>
      <span class="txt"><b>Scrolling table</b><span>Whole grid, headings included</span></span>
      <span class="kbd" id="kbd-scroller" hidden></span>
        </button>
      </div>
    </div>

    <div class="timer">
      <span class="tlabel"><svg class="ticon" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>Delay before full/visible</span>
      <div class="seg" id="timerSeg">
        <button data-delay="0" class="active">Instant</button>
        <button data-delay="3">3s</button>
        <button data-delay="5">5s</button>
      </div>
    </div>
  </div>

  <div class="foot">
    <button type="button" id="recentLink" title="Reopen one of your last 3 captures"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.9-6.4L3 8.4"/><path d="M3 4.2v4.4h4.4"/><path d="M12 7.8V12l3 1.9"/></svg>Recent</button>
    <button type="button" id="shortcuts" title="Set or repair the keyboard shortcuts"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M7 10.5h.01M12 10.5h.01M17 10.5h.01M7.5 14.5h9"/></svg>Shortcuts</button>
    <button type="button" id="options"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.4"/><path d="M12 4.6V2.4M12 19.4v2.2M4.6 12H2.4M19.4 12h2.2M6.8 6.8L5.2 5.2M17.2 17.2l1.6 1.6M17.2 6.8l1.6-1.6M6.8 17.2l-1.6 1.6"/></svg>Settings</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
