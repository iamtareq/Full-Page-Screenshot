<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      color-scheme: light dark;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --border: #e4e7ec;
      --border-strong: #d3d8e0;
      --text: #101828;
      --muted: #667085;
      --faint: #98a2b3;
      --accent: #0d9488;
      --accent-soft: #f0fdfa;
      --accent-line: #99f6e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #14181f; --surface-2: #1b2029; --border: #262d38; --border-strong: #333b48;
        --text: #e7eaee; --muted: #98a2b3; --faint: #77818f;
        --accent: #2dd4bf; --accent-soft: #10231f; --accent-line: #17544c;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      width: 304px; margin: 0; background: var(--surface); color: var(--text);
      font: 13px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* header: a quiet identity strip, not a coloured band */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 14px 12px; border-bottom: 1px solid var(--border);
    }
    header img { width: 26px; height: 26px; border-radius: 7px; flex: 0 0 auto; }
    header h1 { font-size: 13.5px; font-weight: 650; margin: 0; letter-spacing: -.1px; }
    header .tag { display: block; font-size: 11px; color: var(--faint); font-weight: 400; margin-top: 1px; }
    header .ver {
      margin-left: auto; flex: 0 0 auto; font: 500 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--faint); background: var(--surface-2); border: 1px solid var(--border);
      padding: 4px 6px; border-radius: 5px;
    }

    .body { padding: 10px; display: flex; flex-direction: column; gap: 6px; }

    /* capture rows: flat, hairline, a single accent */
    .btn {
      display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 10px; text-align: left;
      border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
      color: var(--text); cursor: pointer;
      transition: background .13s ease, border-color .13s ease;
    }
    .btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .btn:active { background: var(--accent-soft); border-color: var(--accent-line); }

    .chip {
      flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
    }
    /* only the primary action carries the accent */
    .btn.primary .chip { background: var(--accent); border-color: transparent; color: #fff; }
    .btn.primary:hover .chip { filter: brightness(1.06); }
    .chip svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .txt { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
    .txt b { font-size: 12.5px; font-weight: 600; letter-spacing: -.1px; }
    .txt span { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kbd {
      margin-left: auto; flex: 0 0 auto; font: 500 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--faint); background: var(--surface-2); border: 1px solid var(--border);
      padding: 4px 6px; border-radius: 5px; white-space: nowrap;
    }
    .btn:hover .kbd { color: var(--muted); }

    /* delay */
    .timer { display: flex; align-items: center; gap: 8px; padding: 4px 2px 0; }
    .timer .tlabel { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--faint); }
    .timer .ticon { width: 13px; height: 13px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .seg { display: flex; gap: 2px; margin-left: auto; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
    .seg button {
      border: 0; background: transparent; color: var(--muted); cursor: pointer;
      font: 500 11px/1 -apple-system, system-ui, sans-serif; padding: 6px 11px; border-radius: 6px;
      transition: background .13s, color .13s;
    }
    .seg button:hover { color: var(--text); }
    .seg button.active { background: var(--accent); color: #fff; font-weight: 600; }

    /* update: informative, not a warning */
    .update {
      display: none; align-items: center; gap: 10px; padding: 9px 10px 9px 11px;
      border: 1px solid var(--accent-line); border-radius: 10px; background: var(--accent-soft);
    }
    .update.show { display: flex; }
    .update .udot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .update .ucol { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
    .update b { font-size: 12px; font-weight: 600; color: var(--text); }
    .update .h { font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
    .update code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .update .ubtn {
      margin-left: auto; flex: 0 0 auto; border: 0; border-radius: 7px; padding: 7px 11px; cursor: pointer;
      font: 600 11.5px/1 -apple-system, system-ui, sans-serif; background: var(--accent); color: #fff;
    }
    .update .ubtn:hover { filter: brightness(1.08); }
    .update .ubtn:disabled { opacity: .55; cursor: default; }
    @media (prefers-color-scheme: dark) { .update .ubtn { color: #06201c; } }

    /* footer */
    .foot {
      display: flex; align-items: center; justify-content: flex-end; gap: 2px;
      padding: 8px 10px 11px; border-top: 1px solid var(--border);
    }
    .foot a {
      display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500;
      color: var(--muted); text-decoration: none; cursor: pointer; padding: 6px 9px; border-radius: 7px;
      transition: background .13s, color .13s;
    }
    .foot a:hover { background: var(--surface-2); color: var(--text); }
    .foot a svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" />
    <div>
      <h1>Full Page Capture</h1>
      <span class="tag">Capture &middot; annotate &middot; share</span>
    </div>
    <span class="ver" id="verLabel"></span>
  </header>

  <div class="body">
    <div class="update" id="updateBanner">
      <span class="udot"></span>
      <span class="ucol">
        <b>Update available <span id="updVer"></span></b>
        <span class="h" id="updHow">One click &mdash; pulls it and reloads.</span>
      </span>
      <button class="ubtn" id="updBtn">Update</button>
    </div>

    <button class="btn primary" id="full">
      <span class="chip"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>
      <span class="txt"><b>Full page</b><span>Entire scrollable page</span></span>
      <span class="kbd">Alt+Shift+P</span>
    </button>
    <button class="btn" id="visible">
      <span class="chip"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg></span>
      <span class="txt"><b>Visible area</b><span>Just what you see now</span></span>
      <span class="kbd">Alt+Shift+V</span>
    </button>
    <button class="btn" id="region">
      <span class="chip"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="8" y="8" width="8" height="8" rx="1" stroke-dasharray="2 2"/></svg></span>
      <span class="txt"><b>Capture area</b><span>Drag to select &middot; scrolls</span></span>
      <span class="kbd">Alt+Shift+A</span>
    </button>
    <button class="btn" id="element">
      <span class="chip"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg></span>
      <span class="txt"><b>Capture element</b><span>Hover &amp; click a component</span></span>
      <span class="kbd">Alt+Shift+E</span>
    </button>

    <div class="timer">
      <span class="tlabel"><svg class="ticon" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>Delay before full/visible</span>
      <div class="seg" id="timerSeg">
        <button data-delay="0" class="active">Instant</button>
        <button data-delay="3">3s</button>
        <button data-delay="5">5s</button>
      </div>
    </div>
  </div>

  <div class="foot">
    <a id="recentLink" title="Reopen one of your last 3 captures"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Recent</a>
    <a id="options"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H23a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>Settings</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
