<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Full Page Capture</title>
  <link rel="stylesheet" href="result.css" />
</head>
<body>
  <header class="toolbar">
    <!-- Identity is the icon plus what you are looking at. The wordmark used
         to take this slot: you already know which tab you are in, and the
         size of the capture is the one fact worth reading here. -->
    <div class="brand">
      <img src="icons/icon48.png" alt="Full Page Capture" />
      <span class="btitle" id="capTitle"></span>
      <span id="dims">&mdash;</span>
    </div>
    <!-- The drawer lives WITH its button so the caret points at it and it
         follows when the toolbar wraps. -->
    <div class="recentwrap">
      <button class="tbtn ghost recentbtn" id="recentBtn" title="Recent captures - reopen one of your last 3">
      <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.9-6.4L3 8.4"/><path d="M3 4.2v4.4h4.4"/><path d="M12 7.8V12l3 1.9"/></svg><span>Recent</span>
      </button>
    <!-- Recent captures drawer -->
    <div class="recent" id="recentDrawer" hidden>
      <div class="recent-head">
        <h4>Recent captures</h4>
        <span class="recent-count" id="recentCount"></span>
      </div>
      <div id="recentList"></div>
    </div>
    </div>

    <!-- Actions, ending in the primary one. Everything here acts on the
         capture; Recent above is navigation, which is why it sits apart. -->
    <div class="tools" id="tools" hidden>
      <div class="group zoom">
        <div class="grp">
          <button class="tbtn cell" id="zoomOut" title="Zoom out (-)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
          <button class="tbtn cell" id="zoomIn" title="Zoom in (+)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="tbtn cell" id="zoomFit" title="Fit width (0)"><svg viewBox="0 0 24 24"><path d="M4 5v14M20 5v14"/><path d="M8 12h8"/><path d="M11 9l-3 3 3 3M13 9l3 3-3 3"/></svg></button>
        </div>
        <span id="zoomVal">Fit</span>
      </div>
      <div class="group">
        <div class="grp">
          <button class="tbtn cell" id="print" title="Print (Ctrl+P)">
          <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg>
          <span>Print</span>
          </button>
          <button class="tbtn cell" id="infobar" title="Add a bar with the page URL and capture time">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M2 13.5h20M2 18h13"/></svg>
          <span>URL bar</span>
          </button>
        </div>
      </div>
      <div class="group">
        <button class="tbtn" id="crop" title="Crop a region">
        <svg viewBox="0 0 24 24"><path d="M6 2v16a2 2 0 0 0 2 2h14M2 6h16a2 2 0 0 1 2 2v14"/></svg>
        <span>Crop</span>
        </button>
      </div>
      <div class="group quality" id="qualityGroup" hidden>
        <label>Quality</label>
        <input type="range" id="quality" min="0.4" max="1" step="0.01" value="0.92" />
        <span id="qualityVal">92%</span>
      </div>
      <div class="group">
        <button class="tbtn" id="copy" title="Copy image to clipboard (Ctrl+C)">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><rect x="4" y="3" width="11" height="11" rx="2"/></svg>
        <span>Copy</span>
        </button>
        <button class="tbtn drive" id="drive" title="Upload to your Google Drive folder and copy the link">
        <svg viewBox="0 0 24 24"><path d="M6.5 19A4.5 4.5 0 0 1 6 10.1a6 6 0 0 1 11.6-1.6A4.2 4.2 0 0 1 18 19"/><path d="M12 21v-9m0 0L9.2 14.8M12 12l2.8 2.8"/></svg>
        <span>Send to Drive</span>
        </button>
        <button class="tbtn copylink" id="copyLink" title="Copy the last uploaded Drive link again" hidden>
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.41 1.41"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.41-1.41"/></svg>
        <span>Copy link</span>
        </button>
      </div>
      <div class="group">
        <div class="dl">
        <div class="dl-shell">
        <button type="button" class="dl-main" id="download" title="Download (Ctrl+S)">
        <svg class="dl-ico" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
        <span id="downloadLabel">Download PNG</span>
        </button>
        <button type="button" class="dl-caret" id="formatMenuBtn" title="Choose format" aria-haspopup="menu">
        <svg class="dl-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        <span class="dl-sr">Choose format</span>
        </button>
        </div>
        <div class="dl-menu" id="formatMenu" hidden>
        <div class="dl-menu-head">Save as</div>
        <button type="button" data-fmt="png"><span class="dl-name">PNG</span><span class="dl-note">Lossless image</span><svg class="dl-tick" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></button>
        <button type="button" data-fmt="jpg"><span class="dl-name">JPG</span><span class="dl-note">Smaller file</span><svg class="dl-tick" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></button>
        <button type="button" data-fmt="pdf"><span class="dl-name">PDF</span><span class="dl-note">Document</span><svg class="dl-tick" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></button>
        </div>
        </div>
      </div>
    </div>
  </header>


  <!-- Crop action bar -->
  <div class="cropbar" id="cropbar" hidden>
    <span id="cropInfo">Drag on the image to select a region</span>
    <div class="spacer"></div>
    <button class="tbtn" id="cropApply">Apply crop</button>
    <button class="tbtn ghost" id="cropCancel">Cancel</button>
  </div>

  <!-- Annotate mode, part 1: the properties of the CURRENT tool, in a 40px
       strip. It costs height, not width - and fitScale() is width-only, so
       this is free in zoom where the old 240px panel cost 15%. The two rules
       that stop it becoming the wrapping bar it replaces are `height: 40px`
       and `flex-wrap: nowrap` in result.css; do not relax either. -->
  <div class="astrip" id="astrip" hidden>
    <span class="atoolname" id="toolName" role="status" aria-live="polite">Select</span>
    <div class="aslot">
      <div class="aslot-in" id="slotColour">
        <div class="aswatches">
        <div class="acolors" id="acolors"></div>
        <input type="color" id="acustom" class="acustom" value="#D0264A" title="Custom colour" />
        </div>
      </div>
      <div class="aslot-in" id="slotStamp" hidden>
        <div class="astamps" id="astamps" title="QA stamps — click one, then click on the image to drop it">
        <button class="astamp bug" data-stamp="bug">BUG</button>
        <button class="astamp pass" data-stamp="pass">PASS</button>
        <button class="astamp fixed" data-stamp="fixed">FIXED</button>
        <button class="astamp retest" data-stamp="retest">RE-TEST</button>
        </div>
      </div>
    </div>
    <label class="awidth" title="Stroke size - [ and ] adjust it">Size <input type="range" id="awidth" min="1" max="24" step="0.5" value="8" /><span class="awval" id="awidthVal">8</span></label>
    <span class="ahint" id="ahint" title="Drag it to move. Delete removes it, Esc finishes it, [ and ] resize it" hidden>Drag to move &middot; size &amp; colour apply to it</span>
    <div class="spacer"></div>
    <div class="arow">
    <button class="tbtn ghost" id="aundo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="tbtn ghost" id="aredo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="tbtn ghost" id="aclear" title="Remove all annotations">Clear</button>
    </div>
  </div>

  <div class="work">
    <!-- Annotate mode, part 2: the rail. Always in the flow so the stage
         width never changes; only its contents are hidden when idle. -->
    <div class="arail" id="arail">
        <div class="atools" id="atools">
          <button class="atool" data-tool="select" title="Select / move a shape - click it, then drag (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6.5 1.5L10 19z"/></svg></button>
          <span class="rdiv"></span>
          <button class="atool" data-tool="rect" title="Box (R)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/></svg></button>
          <button class="atool" data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
          <button class="atool" data-tool="arrow" title="Arrow (A)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M19 5h-8M19 5v8"/></svg></button>
          <button class="atool" data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg></button>
          <button class="atool" data-tool="pen" title="Free draw (P)"><svg viewBox="0 0 24 24"><path d="M16.8 3.6a2.2 2.2 0 0 1 3.1 3.1L8.5 18.1 3.9 19.6l1.5-4.6z"/><path d="M15.2 5.2l3.1 3.1"/></svg></button>
          <span class="rdiv"></span>
          <button class="atool" data-tool="text" title="Text label (T)"><svg viewBox="0 0 24 24"><path d="M4 6V4h16v2M12 4v16M9 20h6"/></svg></button>
          <button class="atool" data-tool="callout" title="Callout - a comment bubble that points at something (C)"><svg viewBox="0 0 24 24"><path d="M21 12a8 7 0 0 1-8 7H9l-5 3 1.5-4.2A7 7 0 0 1 3 12a8 7 0 0 1 8-7h2a8 7 0 0 1 8 7z"/></svg></button>
          <button class="atool" data-tool="step" title="Numbered step badge ①②③ — click to drop (N)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10.6 10.4l1.6-1V15"/></svg></button>
          <span class="rdiv"></span>
          <button class="atool" data-tool="highlight" title="Highlighter (H)"><svg viewBox="0 0 24 24"><path d="M3 20.5h18"/><path d="M14.6 5.4l4 4-6.6 6.6H7.4v-4.6z"/></svg></button>
          <button class="atool" data-tool="blur" title="Blur / redact sensitive info (B)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 8h4v4H6zM14 8h4v4h-4zM10 12h4v4h-4z" fill="currentColor" stroke="none"/></svg></button>
          <button class="atool" data-tool="whiteout" title="White out - cover a distraction with a solid block (W). To hide sensitive data use Blur instead, so the report shows something was hidden."><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="7" y="8" width="10" height="8" rx="1" fill="currentColor" stroke="none"/></svg></button>
          <span class="rdiv"></span>
          <button class="atool" data-tool="stamp" title="QA stamp - click on the image to drop a labelled pill (S)"><svg viewBox="0 0 24 24"><path d="M10 3.5h4a1 1 0 0 1 1 1V8l2.6 3.4a1 1 0 0 1-.8 1.6H7.2a1 1 0 0 1-.8-1.6L9 8V4.5a1 1 0 0 1 1-1z"/><path d="M6 16.2h12M3.5 20.5h17"/></svg></button>
        </div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-card">
        <div class="spinner"></div>
        <div class="progress-title" id="progressTitle">Stitching screenshot…</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-sub" id="progressSub">Preparing…</div>
      </div>
    </div>

    <!-- Error -->
    <div class="error-wrap" id="errorWrap" hidden>
      <div class="error-card">
        <div class="error-icon"><svg viewBox="0 0 24 24"><path d="M10.3 3.6 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"></path><path d="M12 9v5M12 17.4h.01"></path></svg></div>
        <div class="error-title">Couldn’t capture this page</div>
        <div class="error-msg" id="errorMsg"></div>
      </div>
    </div>

    <!-- Stage -->
    <main class="stage" id="stage" hidden>
      <div class="canvas-host" id="canvasHost">
        <div class="crop-overlay" id="cropOverlay" hidden>
          <div class="crop-rect" id="cropRect" hidden></div>
        </div>
      </div>
    </main>

  </div>


  <!-- What you will get, as opposed to what you are looking at. Every
       value here is one this file already computed. -->
  <div class="statusbar">
    <span id="stFormat">PNG</span><span class="sep">|</span>
    <span id="stDims">&mdash;</span><span class="sep">|</span>
    <span id="stParts">&mdash;</span>
    <span class="spacer"></span>
    <span class="stmsg" id="stMsg"></span>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="lib/pdf.js"></script>
  <script src="result.js"></script>
</body>
</html>
