<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Full Page Capture</title>
  <link rel="stylesheet" href="result.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <img src="icons/icon48.png" alt="" />
      <span>Full Page Capture</span>
    </div>

    <div class="tools" id="tools" hidden>
      <div class="group">
        <button class="tbtn primary" id="download" title="Download">
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16" /></svg>
          <span id="downloadLabel">Download PNG</span>
        </button>
        <button class="tbtn split" id="formatMenuBtn" title="Choose format">
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="menu" id="formatMenu" hidden>
          <button data-fmt="png">PNG image</button>
          <button data-fmt="jpg">JPG image</button>
          <button data-fmt="pdf">PDF document</button>
        </div>
      </div>

      <div class="group">
        <button class="tbtn drive" id="drive" title="Upload to your Google Drive folder and copy the link">
          <svg viewBox="0 0 24 24"><path d="M8 3h8l5.5 9.5L16 22H8l-5.5-9.5z"/><path d="M8 3l5.5 9.5M2.5 12.5H13.5M16 22l-5.5-9.5"/></svg>
          <span>Send to Drive</span>
        </button>
        <button class="tbtn copylink" id="copyLink" title="Copy the last uploaded Drive link again" hidden>
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.41 1.41"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.41-1.41"/></svg>
          <span>Copy link</span>
        </button>
      </div>

      <div class="group">
        <button class="tbtn" id="copy" title="Copy image to clipboard">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          <span>Copy</span>
        </button>
        <button class="tbtn" id="annotate" title="Annotate — draw boxes, arrows, blur (for bug reports)">
          <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5zM2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
          <span>Annotate</span>
        </button>
        <button class="tbtn" id="crop" title="Crop a region">
          <svg viewBox="0 0 24 24"><path d="M6 2v16a2 2 0 0 0 2 2h14M2 6h16a2 2 0 0 1 2 2v14"/></svg>
          <span>Crop</span>
        </button>
        <button class="tbtn" id="print" title="Print">
          <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg>
          <span>Print</span>
        </button>
        <button class="tbtn" id="infobar" title="Add a bar with the page URL and capture time">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1"/><path d="M6 14h12M6 18h8"/></svg>
          <span>URL bar</span>
        </button>
      </div>

      <div class="group quality" id="qualityGroup" hidden>
        <label>Quality</label>
        <input type="range" id="quality" min="0.4" max="1" step="0.01" value="0.92" />
        <span id="qualityVal">92%</span>
      </div>

      <div class="group zoom">
        <button class="tbtn ghost" id="zoomOut" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <span id="zoomVal">Fit</span>
        <button class="tbtn ghost" id="zoomIn" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="tbtn ghost" id="zoomFit" title="Fit width">Fit</button>
      </div>

      <div class="group meta">
        <span id="dims">—</span>
      </div>
    </div>
  </header>

  <!-- Crop action bar -->
  <div class="cropbar" id="cropbar" hidden>
    <span id="cropInfo">Drag on the image to select a region</span>
    <div class="spacer"></div>
    <button class="tbtn" id="cropApply">Apply crop</button>
    <button class="tbtn ghost" id="cropCancel">Cancel</button>
  </div>

  <!-- Annotation toolbar -->
  <div class="annotbar" id="annotbar" hidden>
    <div class="atools" id="atools">
      <button class="atool" data-tool="rect" title="Box"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/></svg></button>
      <button class="atool" data-tool="ellipse" title="Ellipse"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
      <button class="atool" data-tool="arrow" title="Arrow"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M19 5h-8M19 5v8"/></svg></button>
      <button class="atool" data-tool="line" title="Line"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg></button>
      <button class="atool" data-tool="pen" title="Free draw"><svg viewBox="0 0 24 24"><path d="M4 20c3-1 4-6 7-6s2 3 4 3 3-9 5-9"/></svg></button>
      <button class="atool" data-tool="highlight" title="Highlighter"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 16l8-8 4 4-8 8H6v-4z"/></svg></button>
      <button class="atool" data-tool="text" title="Text label"><svg viewBox="0 0 24 24"><path d="M4 6V4h16v2M12 4v16M9 20h6"/></svg></button>
      <button class="atool" data-tool="step" title="Numbered step badge (①②③) — click to drop"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10.6 10.4l1.6-1V15"/></svg></button>
      <button class="atool" data-tool="blur" title="Blur / redact sensitive info"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M6 16h.01M10 16h.01M14 16h.01M18 16h.01"/></svg></button>
    </div>
    <div class="astamps" id="astamps" title="QA stamps — click one, then click on the image to drop it">
      <button class="astamp bug" data-stamp="bug">BUG</button>
      <button class="astamp pass" data-stamp="pass">PASS</button>
      <button class="astamp fixed" data-stamp="fixed">FIXED</button>
      <button class="astamp retest" data-stamp="retest">RE-TEST</button>
    </div>
    <div class="acolors" id="acolors"></div>
    <input type="color" id="acustom" class="acustom" value="#e11d48" title="Custom colour" />
    <label class="awidth">Size <input type="range" id="awidth" min="1" max="24" step="0.5" value="8" /><span class="awval" id="awidthVal">8</span></label>
    <div class="spacer"></div>
    <button class="tbtn ghost" id="aundo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="tbtn ghost" id="aredo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="tbtn ghost" id="aclear">Clear</button>
    <button class="tbtn" id="adone">Done</button>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-card">
      <div class="spinner"></div>
      <div class="progress-title" id="progressTitle">Stitching screenshot…</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-sub" id="progressSub">Preparing…</div>
    </div>
  </div>

  <!-- Error -->
  <div class="error-wrap" id="errorWrap" hidden>
    <div class="error-card">
      <div class="error-icon">⚠️</div>
      <div class="error-title">Couldn’t capture this page</div>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <!-- Stage -->
  <main class="stage" id="stage" hidden>
    <div class="canvas-host" id="canvasHost">
      <div class="crop-overlay" id="cropOverlay" hidden>
        <div class="crop-rect" id="cropRect" hidden></div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="lib/pdf.js"></script>
  <script src="result.js"></script>
</body>
</html>
